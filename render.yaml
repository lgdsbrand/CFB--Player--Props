# =============================================================================
# Render blueprint for the Python worker.
# =============================================================================
# The worker ingests data, computes projections and writes to Supabase. The
# Next.js app (deployed separately on Vercel) only ever reads from Supabase and
# never calls a data provider directly (CLAUDE.md §2).
#
# Every secret lives in the shared env var group below, declared `sync: false`
# so Render prompts for it in the dashboard and it is never stored in this file.
# Do not replace any of these with a literal value.
#
# ---------------------------------------------------------------------------
# THE SCHEDULES AND `MONITORED_JOBS` MUST AGREE.
# ---------------------------------------------------------------------------
# `worker/jobs/monitor_pipeline.py` holds a staleness expectation per job, and
# `tests/test_monitor.py` parses THIS FILE to assert that every scheduled job
# has one, that every expectation names a job that is actually scheduled, and
# that each `max_age_hours` leaves room for one missed run of its cron.
#
# That test exists because the gap is invisible from either side: a cron added
# without an expectation is simply never monitored, and an expectation whose job
# was renamed alerts forever about a job that no longer exists. Both look fine
# in review.
#
# ALL TIMES ARE UTC. Saturday's games finish late Saturday night US time, which
# is Sunday morning UTC — the ingest schedule below is built around that, not
# around a US calendar day.
# =============================================================================

envVarGroups:
  - name: cfb-props-worker
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SUPABASE_DB_URL
        sync: false
      - key: CFBD_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional. The pipeline runs without these: odds and AI both default to
      # the "none" adapter and the app degrades to model leans and an empty
      # read slot (CLAUDE.md §9.1).
      - key: ODDS_API_KEY
        sync: false
      - key: ODDS_API_KEY_FREE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROK_API_KEY
        sync: false
      # Optional. Only needed when app_config.alert_adapter is "webhook"; the
      # default "log" adapter needs nothing. THE URL IS THE CREDENTIAL.
      - key: ALERT_WEBHOOK_URL
        sync: false

services:
  # ---------------------------------------------------------------------------
  # Canaries
  # ---------------------------------------------------------------------------
  # Verifies config, database connectivity, that the migrations are applied,
  # that the worker can WRITE, and that the CFBD key authenticates and carries
  # the paid entitlements. Daily is plenty — it is a canary, not a data job, and
  # it makes exactly one CFBD call.
  - type: cron
    name: cfb-props-healthcheck
    runtime: python
    plan: starter
    rootDir: worker
    schedule: "0 12 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m worker.jobs.healthcheck
    envVars:
      - fromGroup: cfb-props-worker

  # The data-integrity canary: ~150 assertions over the schema, the RLS posture,
  # the anti-lookahead guarantees and the odds math. Exits non-zero if any fail,
  # and records its own pipeline_runs row so the monitor can tell when it stops.
  - type: cron
    name: cfb-props-audit
    runtime: python
    plan: starter
    rootDir: worker
    schedule: "0 13 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m worker.jobs.audit_data
    envVars:
      - fromGroup: cfb-props-worker

  # Watches pipeline_runs and the data those runs are supposed to produce.
  # Six-hourly rather than hourly on purpose: alerts are not deduplicated, so
  # this cadence IS the throttle — see the module docstring for why suppression
  # was rejected. Exits non-zero on a critical finding so Render's own
  # cron-failure notification becomes the backstop channel.
  - type: cron
    name: cfb-props-monitor
    runtime: python
    plan: starter
    rootDir: worker
    schedule: "0 */6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m worker.jobs.monitor_pipeline
    envVars:
      - fromGroup: cfb-props-worker

  # ---------------------------------------------------------------------------
  # Weekly data pipeline
  # ---------------------------------------------------------------------------
  # Sunday 09:00 UTC, after Saturday's games have finished and settled.
  #
  # CHAINED WITH `&&` IN ONE CRON, DELIBERATELY. These four are strictly
  # ordered — splits are built from stats, which need the games and rosters
  # reference data — and Render has no dependency graph between cron services.
  # Four separate schedules guessing at each other's runtime would race. The
  # chain stops at the first failure, and each step still writes its own
  # pipeline_runs row, so the monitor reports precisely which one broke.
  #
  # `--current` ON EVERY STEP, AND IT IS LOAD-BEARING. Without it each job falls
  # through to `app_config.backfill_seasons`, which scopes the HISTORICAL
  # backfill and was `[2024, 2025]` sixteen days before the 2026 kickoff. The
  # chain would run to completion, report success, and refresh last season.
  # See 20260813140000_in_season_scope.sql for how that was found.
  - type: cron
    name: cfb-props-ingest-week
    runtime: python
    plan: starter
    rootDir: worker
    schedule: "0 9 * * 0"
    buildCommand: pip install -r requirements.txt
    startCommand: >-
      python -m worker.jobs.ingest_reference --current &&
      python -m worker.jobs.ingest_stats --current &&
      python -m worker.jobs.ingest_ratings --current &&
      python -m worker.jobs.ingest_rankings --live --current &&
      python -m worker.jobs.build_splits --current
    envVars:
      - fromGroup: cfb-props-worker

  # Tuesday 09:00 UTC. Runs on all projected starters and high-usage skill
  # players regardless of whether a book has posted a line, so the tool is
  # useful early in the week (CLAUDE.md §7). Season and weeks resolve from the
  # schedule; there is no human here to pass them.
  - type: cron
    name: cfb-props-project-week
    runtime: python
    plan: starter
    rootDir: worker
    schedule: "0 9 * * 2"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m worker.jobs.run_projections --all-weeks
    envVars:
      - fromGroup: cfb-props-worker

  # ---------------------------------------------------------------------------
  # In-week refreshes
  # ---------------------------------------------------------------------------
  # Every six hours. College books post props LATE — often Thursday or Friday
  # for Saturday games (CLAUDE.md §7) — so this is a poll for a market that has
  # not appeared yet, not a refresh of one that has. Exits 0 and does nothing
  # while app_config.odds_adapter is "none", which is the current default.
  #
  # THIS IS THE ONLY JOB THAT SPENDS METERED CREDITS. Billing is per market
  # returned, and a capture re-buys the WHOLE slate every time: ~9 markets on
  # each event that carries props, with no discount for a line that has not
  # moved since the last poll. So the cadence is the budget.
  #
  # It was every three hours until 2026-08-12. That is 8 runs/day, and on the
  # 20,000-credit plan the probe measured (docs/odds-coverage-probe.md) a full
  # slate would have consumed the entire MONTHLY allowance in about a week —
  # from a pool shared with the client's MLB, tennis and WNBA models. Six-hourly
  # still catches a Thursday posting within a few hours of it appearing, which
  # is the only latency that matters here.
  #
  # DAILY RATHER THAN THURSDAY-TO-SATURDAY, deliberately, even though books post
  # nothing on a Monday. Two reasons, and the second is the load-bearing one:
  # events with no props posted cost 0 credits, so the off-day polls are very
  # nearly free and restricting the days would save almost nothing; and
  # `tests/test_monitor.py::_cron_period_hours` scores ANY day-of-week-restricted
  # cron as a 168-hour period, which would force `max_age_hours` above 193 and
  # leave the one job with a budget unmonitored for eight days. Free credits are
  # not worth that blind spot.
  #
  # `--event-limit` IS A CIRCUIT BREAKER, NOT A BUDGET — leave it above a full
  # slate. The largest week measured is 99 games (2026 week 1; opening weekends
  # are inflated by FBS-vs-FCS fixtures), so 120 has headroom and still catches a
  # runaway. Tightening it below the slate size does NOT save money safely: the
  # job stops fetching once the limit is reached and skips the REST OF THE
  # PROVIDER'S EVENT LIST, which is stably ordered, so the same tail of the slate
  # would go unpriced every run, all week, silently. That is exactly how
  # app_config.ai_reads_max_per_run came to cover a fifth of the players.
  - type: cron
    name: cfb-props-odds-refresh
    runtime: python
    plan: starter
    rootDir: worker
    schedule: "0 */6 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m worker.jobs.ingest_odds --event-limit 120
    envVars:
      - fromGroup: cfb-props-worker

  # Daily 10:00 UTC. Game spreads and totals for the card (CLAUDE.md §7), from
  # CFBD rather than the metered odds provider — this costs ZERO Odds API
  # credits and must not be confused with `cfb-props-odds-refresh` above, which
  # is the one with a budget.
  #
  # `--live` because the current week's number moves all week; without it the
  # permanent response cache would serve last Tuesday's spread while the job
  # reported success. It re-fetches completed weeks too, which is ~16 wasted
  # calls a day against a 30,000/month CFBD quota — 2% of it, and cheaper than
  # a flag that has to work out which week is current.
  #
  # `--current` because without it this job was demonstrably refreshing the
  # WRONG SEASON. Measured on production 2026-08-13: this cron rewrote 2024 and
  # 2025 at 10:00 that morning and had never fetched a single 2026 line, so the
  # 48 unpriced week-1 games would have stayed unpriced through kickoff while
  # the job reported success every day. See 20260813140000_in_season_scope.sql.
  - type: cron
    name: cfb-props-game-lines
    runtime: python
    plan: starter
    rootDir: worker
    schedule: "0 10 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m worker.jobs.ingest_game_lines --live --current
    envVars:
      - fromGroup: cfb-props-worker

  # Wednesday 14:00 UTC: one read per player per week, cached in Supabase and
  # never generated per page view (CLAUDE.md §2, §10). After Tuesday's
  # projections, before the weekend. Exits 0 and does nothing while
  # app_config.ai_adapter is "none", which it is again as of 2026-08-03 —
  # see 20260803150000. The key resolves to Gemini's FREE tier.
  #
  # ONE RUN A WEEK CANNOT COVER A WEEK, and that is a real limit independent of
  # the key: app_config.ai_reads_max_per_run is 400 against ~2,000 players with
  # projections, so a single Wednesday run writes at most a fifth of the slate
  # and the rest is never reached before the week turns over. The cap was set as
  # a spend guard before the spend was measured; it is ~462 in / ~80 out tokens
  # per read.
  #
  # THROUGHPUT IS STILL UNMEASURED. A first attempt looked like ~7-9s per read,
  # but every one of those calls was being throttled — the run had already hit
  # the free tier's 20-requests-per-DAY ceiling, so the timings were of retries
  # and 429s, not of the pipeline. Nothing here is known about how fast this
  # runs on a paid key. Measure before deciding whether it needs concurrency or
  # the Batch API; do not carry the 4-hour figure forward, it was wrong.
  - type: cron
    name: cfb-props-ai-reads
    runtime: python
    plan: starter
    rootDir: worker
    schedule: "0 14 * * 3"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m worker.jobs.generate_ai_reads
    envVars:
      - fromGroup: cfb-props-worker
